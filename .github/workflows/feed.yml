# Builds v1/<app>/<locale>.json from src/<app>/*.json and publishes the result.
#
#   push to main (src/, tools/, v1/, this file) -> check, then rebuild v1/ and commit it as github-actions[bot]
#   pull_request                                -> check only; the job summary previews what main would publish
#   workflow_dispatch                           -> same as a push to main (re-run after a failure)
#
# A push made with GITHUB_TOKEN never starts another workflow run, and the bot
# commit only touches v1/, so there is no loop. Design notes: README.md "Pipeline".
# Only official actions, pinned to a commit.

name: feed

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "v1/**"
      - ".github/workflows/feed.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "v1/**"
      - ".github/workflows/feed.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch, so two bot commits never race.
concurrency:
  group: feed-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: Validate sources, run tests, rebuild
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Unit tests (generator rules + every item under src/)
        run: python3 -m unittest discover -s tools -p "test_*.py"

      - name: Rebuild v1/ from src/ (pending items are dropped, failed gates left out)
        run: |
          status=0
          python3 tools/build_feed.py --skip-unchanged > build.log 2>&1 || status=$?
          cat build.log
          {
            echo "### Build"
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # One warning per distinct note (e.g. "skipped pending: <ids>"), not one per locale file.
          sed -n 's/^ok   [^ ]* — //p' build.log | tr ';' '\n' | sed 's/^ *//' | sort -u | sed 's/^/::warning::/' || true
          exit "$status"

      - name: Lint the written files (an unapproved item here fails the run)
        run: python3 tools/build_feed.py --check v1/*/*.json

      - name: Preview of the v1/ change
        run: |
          git add -A v1/
          {
            echo "### v1/ change this would publish"
            if git diff --cached --quiet -- v1/; then
              echo "none: v1/ already matches src/"
            else
              echo '```diff'
              git diff --cached --stat -- v1/
              echo
              git diff --cached -- v1/
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat -- v1/

  publish:
    name: Commit v1/ to main
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Rebuild v1/ from src/
        run: python3 tools/build_feed.py --skip-unchanged

      - name: Lint the written files
        run: python3 tools/build_feed.py --check v1/*/*.json

      - name: Commit and push v1/ when it changed
        run: |
          src_sha=$(git rev-parse --short HEAD)
          git add -A v1/
          if git diff --cached --quiet -- v1/; then
            echo "v1/ already matches src/ at ${src_sha}; nothing to commit"
            echo "v1/ already matches src/ at ${src_sha}; nothing to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "feed: rebuild v1/ from src/ at ${src_sha}" \
            -m "Generated by .github/workflows/feed.yml (run ${GITHUB_RUN_ID}). Pending items are dropped; a locale whose gate is not pass is left out of that locale's file."
          git push origin HEAD:main
          echo "Committed $(git rev-parse --short HEAD) to main; GitHub Pages redeploys from it." >> "$GITHUB_STEP_SUMMARY"
